name: Auto Commit - Max Stealth Dynamic Pattern

on:
  schedule:
    # Check every hour to see if it should make a commit
    - cron: '0 * * * *'
  workflow_dispatch: # For manual testing

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Roll Dice and Generate Random Commits
      run: |
        # --- STEALTH HOUR RANDOMIZER ---
        # Bypasses the hourly check on a manual run so you can always test it
        if [ "${{ github.event_name }}" = "schedule" ]; then
          # Pick a random number between 1 and 4
          DICE=$((RANDOM % 4 + 1))
          # Only proceed 25% of the time (1 out of 4 hours). Adjust to change frequency.
          if [ "$DICE" -ne 1 ]; then
            echo "Stealth skip: Skipping this hour to stay unpredictable."
            exit 0
          fi
        fi

        # --- DYNAMIC WEEKDAY COMMIT LOGIC ---
        DAY=$(date +%u)
        
        if [ "$DAY" -eq 6 ] || [ "$DAY" -eq 7 ]; then
          # Weekends: Peak activity (5 to 10 commits)
          NUM_COMMITS=$((RANDOM % 6 + 5))
        elif [ "$DAY" -eq 1 ]; then
          # Monday: Minimal activity (0 to 1 commit)
          NUM_COMMITS=$((RANDOM % 2))
        else
          # Tuesday-Friday: Moderate activity (2 to 5 commits)
          NUM_COMMITS=$((RANDOM % 4 + 2))
        fi

        echo "Target achieved: Generating $NUM_COMMITS commits."

        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"

        for i in $(seq 1 $NUM_COMMITS); do
          echo "Automated session: $(date) - action $i" >> daily_log.txt
          git add daily_log.txt
          git commit -m "chore: update system architecture assets [skip ci]"
        done

    - name: Push changes
      run: |
        git push origin master
              
