name: Auto Commit - Keep Graph Green

on:
  schedule:
    # Runs every day at 12:00 PM UTC (Adjust as needed)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows you to trigger it manually for testing

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Make a change to text file
      run: |
        echo "Last automated run: $(date)" > daily_log.txt

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@://github.com"
        git add daily_log.txt
        git commit -m "chore: automated daily activity update [skip ci]"
        git push
